# DiveFuzz-MC custom-backend spike对拍 config.
# Validates the 2-hart custom bare-metal backend (backend: custom) against the
# litmus7 reference by running it on spike with 2 harts (spike -p2). The custom
# ELF emits the same <count> :> <state>; histogram rows and Observation marker
# the runner/parser already consume, so outcome parsing/classification/archiving
# are unchanged.
dut_target:
- name: "DiveFuzz-MC custom backend (spike)"
  threads: 2
  version: spike-dev
  diff_ref: none
  emu_path: /home/ra4ing/workspace/riscv
  cmd: /home/ra4ing/workspace/riscv/bin/spike -p2 $1
  timeout: 120

seeds:
- name: dfmc_custom_spike
  input: multicore
  multicore:
    gen_only: false
    threads: 2
    seeds_output: /home/ra4ing/workspace/riscv/DiveFuzz/fuzzer/output_custom_spike_seeds
    seeds_num: 3
    seed_offset: 0
    hart_count: 2
    runs_per_seed: 1
    litmus_runs: 200
    litmus_size: 20
    test_families: ["SB", "LB", "MP"]
    noise_level: "none"
    herd_path: /home/ra4ing/.opam/default/bin/herd7
    backend: custom
    custom_harness_dir: /home/ra4ing/workspace/riscv/DiveFuzz/fuzzer/multi-core/xs-custom-harness
